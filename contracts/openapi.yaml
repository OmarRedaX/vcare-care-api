        and `endsAt` come from the consultation type, never from the client. Inside one transaction the service re-validates:
        doctor bookable (`409 DoctorNotBookable`), start in the future (`422 BookingInPast`), within 60 days
        (`422 BeyondBookingHorizon`), inside the doctor's open hours for that doctor-local date and on the slot grid
        (`422 OutsideWorkingHours`), then inserts; an exclusion violation (SQLSTATE 23P01) maps to `409 SlotUnavailable`.
        Same key + same body replays the original 201; same key + different body → `422 IdempotencyConflict`.
        The confirmation email is queued asynchronously and never blocks or rolls back the booking.
        Budget p95 < 200 ms. Rate limit 10 booking writes/min per user.
      security:
        - bearerUser: []
      x-roles: [patient]
      x-ownership: self
      x-account-state: 'status active; emailVerified true'
      x-audit-actions: [consultation.booked]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationCreate'
      responses:
        '201':
          description: Consultation booked (or the replay of the original booking for the same key and body).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
