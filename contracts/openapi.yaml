  # ─────────────────────────────────────────────────────────────── internal
  /internal/doctors/{userId}/summary:
    get:
      operationId: getDoctorSummaryInternal
      tags: [internal]
      summary: Verification state and specialties of a doctor, for admin tooling and future services
      description: |
        Internal listener only. Requires a service token (`typ=service`, `aud` contains `vcare-care`, scope `doctors:read`).
        A user token, even an admin's → `401 ServiceTokenRequired`; missing scope → `403 InsufficientScope`.
        No outbound calls on this path; p95 < 50 ms. No names, emails, or clinical data.
        No MVP service client holds `doctors:read`; the endpoint serves admin tooling and the Phase-2 AI service once a
        client with that scope is provisioned in Identity.
      servers:
        - url: http://localhost:3101
          description: Internal listener (INTERNAL_PORT=3101), network-isolated, never routed by the public ingress.
      security:
        - serviceToken: []
      x-roles: [service]
      x-scope: doctors:read
      x-ownership: none
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          description: The doctor's Identity user id.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Doctor summary.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/DoctorSummaryInternal'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/ServiceTokenRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token issued by identity-service (EdDSA, 15 min). Verified locally against
        `IDENTITY_JWKS_URL` (cached; refreshed on unknown `kid` at most once per minute). Required claims:
        `iss=vcare-identity`, `aud` contains `vcare-care`, `typ=user`, `sub` (user id), `role`, `status`, `ev`.
        If no cached key matches and JWKS cannot be fetched → `401 Unauthorized` (verification is never skipped).
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service token issued by identity-service `POST /internal/auth/token` (client credentials, 300 s):
        `typ=service`, `aud` contains `vcare-care`, `scope` contains `doctors:read`. Accepted only on `/internal/*`.

  headers:
    XRequestId:
      description: Request id (UUID) — the incoming `X-Request-Id` if it is a valid UUID, else generated. Echoed on every response.
      schema:
        type: string
        format: uuid
    CacheControlNoStore:
      description: '`no-store` on every clinical and consultation response.'
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds until the limiter allows another request.
      schema:
        type: integer
        minimum: 1

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied UUID; propagated to logs, audit rows, and every call to Identity.
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required UUID. Stored 24 h in Redis keyed by (route, principal, key) with a body hash. Same key + same body → replay
        of the original response; same key + different body → `422 IdempotencyConflict`. Missing → `400 ValidationFailed`.
        Booking also persists the key on the consultation row (`uq_consultations_idempotency`).
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional UUID with the same replay semantics as on booking writes.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `meta.nextCursor` (encodes the sort value and id).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      description: Numeric id (BIGSERIAL). Non-numeric values never match, so literal sibling paths are unambiguous.
      schema:
        type: integer
        format: int64
        minimum: 1
    DoctorUserIdPath:
      name: doctorUserId
      in: path
      required: true
      description: The doctor's Identity user id (the stable person id used across services).
      schema:
        type: integer
        format: int64
        minimum: 1
    PatientUserIdPath:
      name: patientUserId
      in: path
      required: true
      description: The patient's Identity user id.
      schema:
        type: integer
        format: int64
        minimum: 1
    SpecialtyFilter:
      name: specialty
      in: query
      required: false
      description: Specialty slug.
      schema:
        type: string
        maxLength: 100
        examples: [dermatology]
    LanguageFilter:
      name: language
      in: query
      required: false
      description: ISO 639-1 language code.
      schema:
        type: string
        pattern: '^[a-z]{2}$'
        examples: [ar]
    NameFilter:
      name: name
      in: query
      required: false
      description: Case-insensitive prefix match on the doctor's display name (resolved via cached hydration) or headline.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    MinFee:
      name: minFee
      in: query
      required: false
      description: Minimum consultation fee in minor units (inclusive).
      schema:
        type: integer
        minimum: 0
    MaxFee:
      name: maxFee
      in: query
      required: false
      description: Maximum consultation fee in minor units (inclusive).
      schema:
        type: integer
        minimum: 0
    AvailableFrom:
      name: availableFrom
      in: query
      required: false
      description: Only doctors with a free slot starting at or after this instant (uses the derived next-available cache).
      schema:
        type: string
        format: date-time
    AvailableTo:
      name: availableTo
      in: query
      required: false
      description: Only doctors with a free slot starting before this instant. Window at most 14 days.
      schema:
        type: string
        format: date-time
    SearchSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [earliest_availability, price, experience]
        default: earliest_availability
    SlotTypeId:
      name: typeId
      in: query
      required: true
      description: Consultation type id; must belong to the doctor and be active.
      schema:
        type: integer
        format: int64
        minimum: 1
    SlotFrom:
      name: from
      in: query
      required: true
      description: Window start (ISO-8601 with offset). Clipped to now.
      schema:
        type: string
        format: date-time
    SlotTo:
      name: to
      in: query
      required: true
      description: Window end (ISO-8601 with offset). At most 14 days after `from`; clipped to now + 60 days.
      schema:
        type: string
        format: date-time
    SlotTimezone:
      name: timezone
      in: query
      required: false
      description: IANA zone for `startsAtLocal`/`endsAtLocal`. Defaults to the caller's patient profile timezone, else UTC.
      schema:
        type: string
        maxLength: 64
        examples: [America/New_York]

  responses:
    NoContent:
      description: No content.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    HealthOk:
      description: All required dependencies are reachable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    HealthDown:
      description: A required dependency (Postgres or Redis) is down. Body is the health report with `status=down`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    DoctorProfileOwnOk:
      description: The caller's own doctor profile.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/DoctorProfileOwn'
    DoctorProfileOwnCreated:
      description: The caller's doctor profile was created.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/DoctorProfileOwn'
    VerificationApplicationOk:
      description: A verification application with signed document URLs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/VerificationApplication'
    ApprovalPendingSync:
      description: Decision recorded; Identity has not confirmed the account status yet. The doctor stays unbookable until synced.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalPendingSync'
    WorkingHoursOk:
      description: The doctor's weekly hours.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/WorkingHours'
    PatientProfileOk:
      description: Patient profile including clinical fields (never served to admins).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/PatientProfile'
    ConsultationOk:
      description: The consultation (viewer-aware).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/Consultation'
    SessionJoinOk:
      description: Session join details for this participant only.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/SessionJoin'
    MedicalRecordOk:
      description: The medical record with amendments and signed attachment URLs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/MedicalRecord'
    MedicalRecordCreated:
      description: Record created.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/MedicalRecord'
    HelpArticleOk:
      description: The help article.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/HelpArticle'
    HelpArticleCreated:
      description: Help article created.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success:
                const: true
              data:
                $ref: '#/components/schemas/HelpArticle'

    # ── errors (all bodies are the one ErrorEnvelope) ──
    ValidationFailed:
      description: '`ValidationFailed` — DTO validation failed, unknown properties, a missing required `Idempotency-Key`, or a window too large.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: ValidationFailed
              message: Request validation failed
              details:
                - field: startsAt
                  issue: must be an ISO-8601 date-time with offset
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    Unauthorized:
      description: '`Unauthorized` (missing/invalid bearer token, unknown key) or `TokenExpired`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: TokenExpired
              message: Access token expired
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    ServiceTokenRequired:
      description: '`ServiceTokenRequired` — `/internal/*` without a valid service token (a user token, even an admin''s, lands here).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: ServiceTokenRequired
              message: A service token is required
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    Forbidden:
      description: '`Forbidden` — role or ownership check failed, account state not allowed, or the doctor is locally suspended.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: Forbidden
              message: You are not allowed to perform this action
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    InsufficientScope:
      description: '`InsufficientScope` — the service token lacks `doctors:read`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: InsufficientScope
              message: The service token lacks the required scope
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    BookingForbidden:
      description: '`EmailNotVerified` (token `ev=false`) or `Forbidden` (wrong role or non-active account).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: EmailNotVerified
              message: Verify your email before booking
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    RecordWriteForbidden:
      description: '`NotAssignedDoctor` (a doctor other than the consultation''s doctor) or `Forbidden` (wrong role, suspended doctor).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NotAssignedDoctor
              message: Only the assigned doctor can write this record
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    NotFound:
      description: '`NotFound` — absent, soft-deleted, or not visible to the caller (existence is not revealed).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NotFound
              message: Resource not found
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    Conflict:
      description: '`Conflict` — generic uniqueness or state conflict (e.g. duplicate slug, application already submitted).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: Conflict
              message: The resource already exists
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    BookingConflict:
      description: '`DoctorNotBookable` (not approved+synced, suspended, not accepting, or no active type) or `SlotUnavailable` (taken, incl. exclusion violation).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: SlotUnavailable
              message: The selected slot is no longer available
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    RescheduleConflict:
      description: '`PolicyWindowViolation`, `InvalidTransition`, `DoctorNotBookable`, or `SlotUnavailable`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: PolicyWindowViolation
              message: This consultation can no longer be changed by the patient
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    CancelConflict:
      description: '`PolicyWindowViolation` (patient inside the window) or `InvalidTransition` (terminal or not cancellable).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: InvalidTransition
              message: The consultation cannot change from its current status
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    SessionConflict:
      description: '`RoomNotOpen` (outside the session window) or `InvalidTransition`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RoomNotOpen
              message: The session room is not open
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    InvalidTransition:
      description: '`InvalidTransition` — lifecycle transition not allowed (including any change to a terminal state).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: InvalidTransition
              message: The consultation cannot change from its current status
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    NoShowConflict:
      description: '`NoShowTooEarly` (before `starts_at` + grace) or `InvalidTransition`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NoShowTooEarly
              message: A no-show can be marked only after the grace period
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    RecordCreateConflict:
      description: '`RecordRequiresCompleted` (consultation not `completed`) or `Conflict` (a record already exists).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RecordRequiresCompleted
              message: A record can be written only for a completed consultation
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    RecordLocked:
      description: '`RecordLocked` — attachments cannot be deleted after the 24 h lock.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RecordLocked
              message: The record is locked
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    ApplicationNotReviewable:
      description: '`ApplicationNotReviewable` — the application is not in `submitted`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: ApplicationNotReviewable
              message: Only submitted applications can be reviewed
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    ScheduleConflictsUnconfirmed:
      description: '`ScheduleConflictsUnconfirmed` (body lists the affected consultation ids; resubmit with `confirmConflicts=true`) or `Conflict` (a live exception already exists for a date).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleConflicts'
    BookingUnprocessable:
      description: '`OutsideWorkingHours`, `BookingInPast`, `BeyondBookingHorizon`, or `IdempotencyConflict`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: OutsideWorkingHours
              message: The requested time is outside the doctor's working hours
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    IdempotencyConflict:
      description: '`IdempotencyConflict` — the same `Idempotency-Key` was used with a different body.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: IdempotencyConflict
              message: The idempotency key was already used with a different request
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    RateLimited:
      description: '`RateLimited` — Redis sliding-window limiter tripped.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RateLimited
              message: Too many requests
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    InternalError:
      description: '`InternalError` — unhandled error (no internals in the body). Also returned when an audit write for a clinical read fails.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: InternalError
              message: An unexpected error occurred
              requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
    SuspensionPending:
      description: '`IdentityUnavailable` — the suspension is applied locally (bookings and doctor actions blocked) but Identity has not confirmed session revocation. A durable job keeps retrying.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuspensionPending'

  schemas:
    # ── envelopes ──
    ErrorCode:
      type: string
      description: Stable error codes owned by care-service (CLAUDE.md → API conventions).
      enum:
        - ValidationFailed
        - Unauthorized
        - TokenExpired
        - ServiceTokenRequired
        - InsufficientScope
        - Forbidden
        - EmailNotVerified
        - DoctorNotBookable
        - SlotUnavailable
        - OutsideWorkingHours
        - BookingInPast
        - BeyondBookingHorizon
        - PolicyWindowViolation
        - InvalidTransition
        - NoShowTooEarly
        - RoomNotOpen
        - RecordRequiresCompleted
        - NotAssignedDoctor
        - RecordLocked
        - ApplicationNotReviewable
        - ScheduleConflictsUnconfirmed
        - IdentityUnavailable
        - IdempotencyConflict
        - NotFound
        - Conflict
        - RateLimited
        - InternalError
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string
    ErrorEnvelope:
      type: object
      description: The one error envelope, identical to identity-service. Some errors add a sibling member next to `error` (see ScheduleConflicts, SuspensionPending).
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              format: uuid
    ScheduleConflicts:
      description: 409 body for `ScheduleConflictsUnconfirmed` — the envelope plus the affected consultations.
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: object
              required: [consultationIds, count]
              properties:
                consultationIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                count:
                  type: integer
                  minimum: 1
      example:
        success: false
        error:
          code: ScheduleConflictsUnconfirmed
          message: The change affects existing consultations; resubmit with confirmConflicts=true
          requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
        conflicts:
          consultationIds: [1042, 1057]
          count: 2
    SuspensionPending:
      description: 503 body for a suspension whose session revocation Identity has not yet confirmed.
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [suspension]
          properties:
            suspension:
              type: string
              const: applied-locally, session-revocation-pending
            data:
              $ref: '#/components/schemas/SuspensionResult'
      example:
        success: false
        error:
          code: IdentityUnavailable
          message: Suspension applied locally; session revocation is pending
          requestId: 3f0e4c1a-7b5d-4e2a-9c61-0d2b8a6f5e11
        suspension: applied-locally, session-revocation-pending
    ApprovalPendingSync:
      type: object
      description: 202 body for Case 1 when Identity has not confirmed yet.
      required: [success, data]
      properties:
        success:
          const: true
        data:
          allOf:
            - $ref: '#/components/schemas/VerificationApplication'
            - type: object
              required: [identitySync]
              properties:
                identitySync:
                  type: string
                  enum: [pending, failed]
                  description: '`pending` while the durable retrier works; `failed` after a non-retryable Identity 409.'
    PaginationMeta:
      type: object
      required: [nextCursor, hasMore, count]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null on the last page.
        hasMore:
          type: boolean
        count:
          type: integer
          minimum: 0
          description: Number of items in this page.
    SlotWindowMeta:
      type: object
      required: [from, to, timezone, doctorTimezone, count]
      properties:
        from:
          type: string
          format: date-time
          description: Effective window start after clipping to now.
        to:
          type: string
          format: date-time
          description: Effective window end after clipping to the horizon.
        timezone:
          type: string
          description: Rendering timezone of the `*Local` fields.
        doctorTimezone:
          type: string
        count:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        service:
          type: string
          const: care-service
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
            identityJwks:
              type: string
              enum: [cached, stale, missing]
              description: Informational; `degraded` when stale, never `down` on its own.

    HydratedUserFields:
      type: object
      description: |
        Borrowed from identity-service via batch hydration (Case 2, `GET /internal/users?ids=`). Never stored long-term
        (Redis TTL 300 s); null when degraded. Identity's `status` is used only to hide non-active doctors from search,
        never for authorization, and is not exposed here.
      required: [displayName, avatarUrl, profileHydrated]
      properties:
        displayName:
          type: [string, 'null']
          description: Identity's `fullName`.
        avatarUrl:
          type: [string, 'null']
          format: uri
        profileHydrated:
          type: boolean
          description: false when Identity was unavailable and no cached entry existed.

    # ── specialties ──
    Specialty:
      type: object
      required: [id, name, slug, description, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SpecialtyCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 100
        description:
          type: string
          maxLength: 2000
    SpecialtyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        isActive:
          type: boolean

    # ── doctors ──
    VerificationStatus:
      type: string
      enum: [draft, submitted, approved, rejected]
    IdentitySyncStatus:
      type: string
      enum: [not_required, pending, synced, failed]
      description: '`not_required` before any decision; `pending` after a Case 1/3 decision until Identity confirms; `synced` once confirmed; `failed` when Identity answered a non-retryable `409 InvalidStatusTransition` (alerted, needs an operator).'
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Minor units (e.g. 25000 = 250.00).
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [EGP]
    SpecialtyRef:
      type: object
      required: [id, slug, name, isPrimary]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        isPrimary:
          type: boolean
    DoctorProfile:
      description: Public view of a doctor (search results and profile). No verification internals, no suspension reason.
      allOf:
        - $ref: '#/components/schemas/HydratedUserFields'
        - type: object
          required: [userId, headline, bio, yearsExperience, languages, specialties, consultationFee, timezone, isAcceptingPatients, nextAvailableAt, consultationTypes]
          properties:
            userId:
              type: integer
              format: int64
              description: The doctor's Identity user id (path key for /api/doctors/{doctorUserId}).
            headline:
              type: string
              maxLength: 160
            bio:
              type: [string, 'null']
              maxLength: 4000
            yearsExperience:
              type: integer
              minimum: 0
              maximum: 70
            languages:
              type: array
              items:
                type: string
                pattern: '^[a-z]{2}$'
            specialties:
              type: array
              items:
                $ref: '#/components/schemas/SpecialtyRef'
            consultationFee:
              $ref: '#/components/schemas/Money'
            timezone:
              type: string
              examples: [Africa/Cairo]
            isAcceptingPatients:
              type: boolean
            nextAvailableAt:
              type: [string, 'null']
              format: date-time
              description: Derived from the next-available cache (14-day look-ahead); null when none or not yet computed.
            consultationTypes:
              type: array
              items:
                $ref: '#/components/schemas/ConsultationType'
            nextAvailableSlots:
              type: array
              description: Present only on GET /api/doctors/{doctorUserId}; the first few free slots for the first active type.
              items:
                $ref: '#/components/schemas/Slot'
            status:
              type: string
              enum: [bookable, not_bookable]
              description: Admin view only.
    DoctorProfileOwn:
      description: The doctor's own full view, including verification and sync state.
      type: object
      required: [id, userId, headline, bio, yearsExperience, languages, specialties, consultationFee, defaultSlotMinutes, timezone, isAcceptingPatients, verificationStatus, identitySyncStatus, isSuspended, suspendedAt, isBookable, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Doctor profile id (also the application id).
        userId:
          type: integer
          format: int64
        headline:
          type: string
        bio:
          type: [string, 'null']
        yearsExperience:
          type: integer
        languages:
          type: array
          items:
            type: string
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyRef'
        consultationFee:
          $ref: '#/components/schemas/Money'
        defaultSlotMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
        isAcceptingPatients:
          type: boolean
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        reviewNote:
          type: [string, 'null']
        identitySyncStatus:
          $ref: '#/components/schemas/IdentitySyncStatus'
        isSuspended:
          type: boolean
        suspendedAt:
          type: [string, 'null']
          format: date-time
        isBookable:
          type: boolean
          description: Domain rule 6 evaluated now.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DoctorApplyRequest:
      type: object
      additionalProperties: false
      required: [headline, yearsExperience, languages, specialtyIds, primarySpecialtyId, consultationFee, defaultSlotMinutes, timezone, submit]
      properties:
        headline:
          type: string
          minLength: 5
          maxLength: 160
        bio:
          type: string
          maxLength: 4000
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 70
        languages:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z]{2}$'
        specialtyIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: integer
            format: int64
        primarySpecialtyId:
          type: integer
          format: int64
          description: Must be one of `specialtyIds`.
        consultationFee:
          $ref: '#/components/schemas/Money'
        defaultSlotMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
          maxLength: 64
          description: IANA zone, validated with luxon.
        submit:
          type: boolean
          description: true moves the application to `submitted` (requires license and id documents).
    DoctorProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        headline:
          type: string
          minLength: 5
          maxLength: 160
        bio:
          type: [string, 'null']
          maxLength: 4000
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 70
        languages:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z]{2}$'
        specialtyIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: integer
            format: int64
        primarySpecialtyId:
          type: integer
          format: int64
        consultationFee:
          $ref: '#/components/schemas/Money'
        defaultSlotMinutes:
          type: integer
          minimum: 5
          maximum: 240
        timezone:
          type: string
          maxLength: 64
        isAcceptingPatients:
          type: boolean
    DoctorSummaryInternal:
      type: object
      description: Minimal verification state for service callers. No names, contact data, or clinical data.
      required: [userId, doctorProfileId, verificationStatus, identitySyncStatus, isSuspended, suspendedAt, isAcceptingPatients, isBookable, primarySpecialty, specialties, decidedAt]
      properties:
        userId:
          type: integer
          format: int64
        doctorProfileId:
          type: integer
          format: int64
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        identitySyncStatus:
          $ref: '#/components/schemas/IdentitySyncStatus'
        isSuspended:
          type: boolean
        suspendedAt:
          type: [string, 'null']
          format: date-time
        isAcceptingPatients:
          type: boolean
        isBookable:
          type: boolean
        primarySpecialty:
          oneOf:
            - $ref: '#/components/schemas/SpecialtyRef'
            - type: 'null'
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyRef'
        decidedAt:
          type: [string, 'null']
          format: date-time

    # ── verification ──
    VerificationDocumentType:
      type: string
      enum: [license, id, degree]
    VerificationDocument:
      type: object
      required: [id, type, status, fileType, sizeBytes, uploadedAt, downloadUrl, downloadUrlExpiresAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/VerificationDocumentType'
        status:
          type: string
          enum: [uploaded, accepted, rejected]
        fileType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        reviewNote:
          type: [string, 'null']
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: HMAC-signed URL bound to the viewer, TTL ≤ 10 minutes. Null in list views (no URL issued). Never logged.
        downloadUrlExpiresAt:
          type: [string, 'null']
          format: date-time
    VerificationDocumentUpload:
      type: object
      required: [type, file]
      properties:
        type:
          $ref: '#/components/schemas/VerificationDocumentType'
        file:
          type: string
          contentMediaType: application/octet-stream
          description: PDF, JPEG, or PNG; at most 10 MB.
    VerificationApplication:
      type: object
      description: A doctor's application — a view over the doctor profile's verification state plus its documents.
      required: [id, doctorUserId, doctor, status, identitySyncStatus, submittedAt, decidedAt, reviewedBy, reviewNote, documents]
      properties:
        id:
          type: integer
          format: int64
          description: Application id = doctor profile id.
        doctorUserId:
          type: integer
          format: int64
        doctor:
          $ref: '#/components/schemas/HydratedUserFields'
        status:
          $ref: '#/components/schemas/VerificationStatus'
        identitySyncStatus:
          $ref: '#/components/schemas/IdentitySyncStatus'
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtyRef'
        yearsExperience:
          type: integer
        submittedAt:
          type: [string, 'null']
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        reviewedBy:
          type: [integer, 'null']
          format: int64
          description: Admin user id.
        reviewNote:
          type: [string, 'null']
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDocument'
        missingRequirements:
          type: array
          description: Present on the doctor's own view; e.g. `license_document`, `id_document`.
          items:
            type: string
    ApplicationApprove:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
    ApplicationReject:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
    SuspendDoctor:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
    SuspensionResult:
      type: object
      required: [doctorUserId, suspendedAt, identitySyncStatus, flaggedConsultationIds]
      properties:
        doctorUserId:
          type: integer
          format: int64
        suspendedAt:
          type: string
          format: date-time
        identitySyncStatus:
          $ref: '#/components/schemas/IdentitySyncStatus'
        flaggedConsultationIds:
          type: array
          description: Future non-terminal consultations flagged `needs_admin_followup`.
          items:
            type: integer
            format: int64

    # ── schedules ──
    TimeOfDay:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$'
      description: Doctor-local wall-clock time `HH:mm`; `24:00` allowed as an end time.
      examples: ['09:00']
    TimeInterval:
      type: object
      additionalProperties: false
      required: [startTime, endTime]
      properties:
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
        endTime:
          $ref: '#/components/schemas/TimeOfDay'
    WorkingHoursDay:
      type: object
      additionalProperties: false
      description: One ISO weekday with one or more non-overlapping intervals (split shifts). A shift crossing midnight is two intervals on two weekdays.
      required: [weekday, intervals]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 = Monday.
        intervals:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/TimeInterval'
      example:
        weekday: 1
        intervals:
          - startTime: '09:00'
            endTime: '12:00'
          - startTime: '14:00'
            endTime: '18:00'
    WorkingHours:
      type: object
      required: [timezone, days]
      properties:
        timezone:
          type: string
          description: The doctor's IANA timezone in which the hours are interpreted.
        days:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/WorkingHoursDay'
    WorkingHoursReplace:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/WorkingHoursDay'
        confirmConflicts:
          type: boolean
          default: false
    ScheduleExceptionType:
      type: string
      enum: [day_off, custom_hours]
    ScheduleException:
      type: object
      required: [id, date, type, startTime, endTime, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
          description: Doctor-local date.
        type:
          $ref: '#/components/schemas/ScheduleExceptionType'
        startTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        reason:
          type: [string, 'null']
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    ScheduleExceptionCreate:
      type: object
      additionalProperties: false
      required: [type, date]
      properties:
        type:
          $ref: '#/components/schemas/ScheduleExceptionType'
        date:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: '`day_off` only; inclusive; at most 60 days after `date`.'
        startTime:
          $ref: '#/components/schemas/TimeOfDay'
        endTime:
          $ref: '#/components/schemas/TimeOfDay'
        reason:
          type: string
          maxLength: 500
        confirmConflicts:
          type: boolean
          default: false
    ConsultationType:
      type: object
      required: [id, name, durationMinutes, price, currency, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
          examples: [First visit]
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
        price:
          type: integer
          minimum: 0
          description: Minor units.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsultationTypeCreate:
      type: object
      additionalProperties: false
      required: [name, durationMinutes, price, currency]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
        price:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    ConsultationTypeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
        price:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        isActive:
          type: boolean

    # ── slots ──
    Slot:
      type: object
      description: A computed, never-stored free interval. Half-open [startsAt, endsAt).
      required: [startsAt, endsAt, startsAtLocal, endsAtLocal, timezone]
      properties:
        startsAt:
          type: string
          format: date-time
          description: UTC (`Z`).
          examples: ['2026-09-21T06:00:00Z']
        endsAt:
          type: string
          format: date-time
          examples: ['2026-09-21T06:30:00Z']
        startsAtLocal:
          type: string
          format: date-time
          description: Rendered in `timezone` with its offset.
          examples: ['2026-09-21T02:00:00-04:00']
        endsAtLocal:
          type: string
          format: date-time
          examples: ['2026-09-21T02:30:00-04:00']
        timezone:
          type: string
          examples: [America/New_York]

    # ── consultations ──
    ConsultationStatus:
      type: string
      enum: [booked, waiting, in_progress, completed, cancelled, no_show]
    Participant:
      allOf:
        - $ref: '#/components/schemas/HydratedUserFields'
        - type: object
          required: [userId]
          properties:
            userId:
              type: integer
              format: int64
    Consultation:
      type: object
      description: |
        Viewer-aware. Participants (patient, assigned doctor) receive `complaintText`; the **admin view omits
        `complaintText`** entirely. `*Local` fields are rendered in `timezone`: the patient's `patientTimezone` for the
        patient, the doctor's timezone for the doctor, and the `timezone` query parameter (default UTC) for admins.
      required: [id, status, doctor, patient, consultationType, startsAt, endsAt, startsAtLocal, endsAtLocal, timezone, patientTimezone, price, needsAdminFollowup, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ConsultationStatus'
        doctor:
          $ref: '#/components/schemas/Participant'
        patient:
          $ref: '#/components/schemas/Participant'
        consultationType:
          type: object
          required: [id, name, durationMinutes]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            durationMinutes:
              type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        startsAtLocal:
          type: string
          format: date-time
        endsAtLocal:
          type: string
          format: date-time
        timezone:
          type: string
        patientTimezone:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        complaintText:
          type: string
          maxLength: 4000
          description: Participants only. Absent in admin views. Never logged.
        joinedAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        cancelledBy:
          type: [string, 'null']
          enum: [patient, doctor, admin, null]
        cancelReason:
          type: [string, 'null']
        needsAdminFollowup:
          type: boolean
        followupReason:
          type: [string, 'null']
          enum: [doctor_suspended, schedule_blocked, null]
        followUpOfRecordId:
          type: [integer, 'null']
          format: int64
        hasRecord:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsultationCreate:
      type: object
      additionalProperties: false
      description: No duration, `endsAt`, patient id, or price from the client — all derived server-side.
      required: [doctorId, typeId, startsAt, complaintText, patientTimezone]
      properties:
        doctorId:
          type: integer
          format: int64
          description: The doctor's Identity user id.
        typeId:
          type: integer
          format: int64
        startsAt:
          type: string
          format: date-time
          description: ISO-8601 with offset; must equal a computed slot start.
        complaintText:
          type: string
          minLength: 3
          maxLength: 4000
        patientTimezone:
          type: string
          maxLength: 64
          description: IANA zone, validated with luxon.
        followUpOfRecordId:
          type: integer
          format: int64
          description: Optional; a record of this patient with this doctor that recommended a follow-up.
      example:
        doctorId: 204
        typeId: 31
        startsAt: '2026-09-21T09:00:00+03:00'
        complaintText: Synthetic example complaint text
        patientTimezone: America/New_York
    Reschedule:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: New start; duration still comes from the consultation type.
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Required when the caller is an admin.
    Cancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Required for doctor and admin callers; optional for patients.
    NoShow:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
    SessionJoin:
      type: object
      required: [consultation, roomId, joinToken, joinTokenExpiresAt, windowOpensAt, windowClosesAt]
      properties:
        consultation:
          $ref: '#/components/schemas/Consultation'
        roomId:
          type: string
          maxLength: 128
        joinToken:
          type: string
          description: Short-lived provider token for this participant only. Never logged.
        joinTokenExpiresAt:
          type: string
          format: date-time
        windowOpensAt:
          type: string
          format: date-time
        windowClosesAt:
          type: string
          format: date-time
    CalendarView:
      type: object
      required: [from, to, timezone, consultations, exceptions]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
        consultations:
          type: array
          items:
            $ref: '#/components/schemas/Consultation'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleException'

    # ── patients ──
    PatientProfile:
      type: object
      required: [id, userId, dateOfBirth, gender, bloodType, allergies, chronicConditions, timezone, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        dateOfBirth:
          type: [string, 'null']
          format: date
        gender:
          type: [string, 'null']
          enum: [female, male, other, undisclosed, null]
        bloodType:
          type: [string, 'null']
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, unknown, null]
        allergies:
          type: array
          items:
            type: string
            maxLength: 200
        chronicConditions:
          type: array
          items:
            type: string
            maxLength: 200
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PatientProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        dateOfBirth:
          type: [string, 'null']
          format: date
        gender:
          type: [string, 'null']
          enum: [female, male, other, undisclosed, null]
        bloodType:
          type: [string, 'null']
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, unknown, null]
        allergies:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
        chronicConditions:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
        timezone:
          type: string
          maxLength: 64
          description: Required when the profile does not exist yet.
    PatientTimeline:
      type: object
      required: [patient, records]
      properties:
        patient:
          $ref: '#/components/schemas/PatientProfile'
        records:
          type: array
          items:
            $ref: '#/components/schemas/MedicalRecord'

    # ── records ──
    MedicalRecord:
      type: object
      required: [id, consultationId, patientUserId, doctorUserId, chiefComplaint, examinationNotes, diagnosisText, diagnosisCode, treatmentPlan, followUpInDays, lockedAt, isLocked, amendments, attachments, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        consultationId:
          type: integer
          format: int64
        patientUserId:
          type: integer
          format: int64
        doctorUserId:
          type: integer
          format: int64
        chiefComplaint:
          type: string
        examinationNotes:
          type: [string, 'null']
        diagnosisText:
          type: [string, 'null']
        diagnosisCode:
          type: [string, 'null']
          maxLength: 16
          description: ICD-10 code.
        treatmentPlan:
          type: [string, 'null']
        followUpInDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
        lockedAt:
          type: string
          format: date-time
          description: created_at + 24 h.
        isLocked:
          type: boolean
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/MedicalRecordAmendment'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RecordAttachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedicalRecordCreate:
      type: object
      additionalProperties: false
      required: [chiefComplaint]
      properties:
        chiefComplaint:
          type: string
          minLength: 3
          maxLength: 2000
        examinationNotes:
          type: string
          maxLength: 10000
        diagnosisText:
          type: string
          maxLength: 2000
        diagnosisCode:
          type: string
          pattern: '^[A-Z][0-9]{2}(\.[0-9A-Z]{1,4})?$'
        treatmentPlan:
          type: string
          maxLength: 10000
        followUpInDays:
          type: integer
          minimum: 1
          maximum: 365
    MedicalRecordPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Before the lock updates in place; after the lock becomes an amendment and `reason` is required.
      properties:
        chiefComplaint:
          type: string
          minLength: 3
          maxLength: 2000
        examinationNotes:
          type: string
          maxLength: 10000
        diagnosisText:
          type: string
          maxLength: 2000
        diagnosisCode:
          type: string
          pattern: '^[A-Z][0-9]{2}(\.[0-9A-Z]{1,4})?$'
        treatmentPlan:
          type: string
          maxLength: 10000
        followUpInDays:
          type: integer
          minimum: 1
          maximum: 365
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    MedicalRecordAmendment:
      type: object
      description: Append-only correction created after the record lock. Only the amended fields are non-null.
      required: [id, recordId, authorUserId, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        recordId:
          type: integer
          format: int64
        authorUserId:
          type: integer
          format: int64
        chiefComplaint:
          type: [string, 'null']
        examinationNotes:
          type: [string, 'null']
        diagnosisText:
          type: [string, 'null']
        diagnosisCode:
          type: [string, 'null']
        treatmentPlan:
          type: [string, 'null']
        followUpInDays:
          type: [integer, 'null']
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    RecordAttachment:
      type: object
      required: [id, recordId, fileType, sizeBytes, description, createdAt, downloadUrl, downloadUrlExpiresAt]
      properties:
        id:
          type: integer
          format: int64
        recordId:
          type: integer
          format: int64
        fileType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        description:
          type: [string, 'null']
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: HMAC-signed, viewer-bound, TTL ≤ 10 minutes; issuance is an audited clinical read. Never logged.
        downloadUrlExpiresAt:
          type: [string, 'null']
          format: date-time
    RecordAttachmentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: PDF, JPEG, or PNG; at most 10 MB.
        description:
          type: string
          maxLength: 500

    # ── help articles ──
    HelpArticleCategory:
      type: string
      enum: [how-it-works, preparing-for-consultation, cancellation-policy, platform-rules]
    HelpArticleAudience:
      type: string
      enum: [patient, doctor]
    HelpArticle:
      type: object
      required: [id, title, body, category, audience, isPublished, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        body:
          type: string
          description: Markdown.
        category:
          $ref: '#/components/schemas/HelpArticleCategory'
        audience:
          $ref: '#/components/schemas/HelpArticleAudience'
        isPublished:
          type: boolean
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    HelpArticleCreate:
      type: object
      additionalProperties: false
      required: [title, body, category, audience, isPublished]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 50000
        category:
          $ref: '#/components/schemas/HelpArticleCategory'
        audience:
          $ref: '#/components/schemas/HelpArticleAudience'
        isPublished:
          type: boolean
    HelpArticleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 50000
        category:
          $ref: '#/components/schemas/HelpArticleCategory'
        audience:
          $ref: '#/components/schemas/HelpArticleAudience'
        isPublished:
          type: boolean

    # ── audit ──
    AuditLogEntry:
      type: object
      description: Append-only audit entry. `metadata` holds ids, statuses, and reasons only — never clinical text or PII.
      required: [id, actorUserId, actorRole, action, entityType, entityId, requestId, metadata, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: [integer, 'null']
          format: int64
          description: Null for system actors (retry jobs).
        actorRole:
          type: string
          enum: [patient, doctor, admin, service, system]
        action:
          type: string
          examples: [record.read]
        entityType:
          type: string
          examples: [medical_record]
        entityId:
          type: integer
          format: int64
        requestId:
          type: [string, 'null']
          format: uuid
        metadata:
          type: object
          additionalProperties:
            type: [string, number, boolean, 'null']
          examples:
            - fromStatus: booked
              toStatus: cancelled
              consultationId: 1042
        createdAt:
          type: string
          format: date-time
