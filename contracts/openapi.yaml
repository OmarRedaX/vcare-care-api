  # ─────────────────────────────────────────────────────────────── admin: suspension (Case 3)
  /api/admin/doctors/{doctorUserId}/suspend:
    patch:
      operationId: suspendDoctor
      tags: [admin-doctors]
      summary: Suspend a doctor and revoke their sessions (Integration Case 3)
      description: |
        0. Precondition: only an approved, synced, not-suspended doctor can be suspended, else `409 InvalidTransition`.
           Suspending an already-suspended doctor is a **200 no-op** that returns the current state (its
           `identitySyncStatus` shows whether revocation is still pending).
        1. One transaction: `suspended_at`, `suspension_reason`, `identity_sync_status='pending'`; every future non-terminal
           consultation flagged `needs_admin_followup=true`; audit rows. From this commit Care blocks new bookings and all
           doctor actions.
        2. `PATCH /internal/users/{id}/status` on Identity → `suspended` (Identity revokes all refresh tokens), inline attempts
           for about 6 s, then a durable retry job with backoff capped at 60 s and no attempt limit for transient failures
           (network, timeout, 429, 5xx, one token refresh on 401). Alert `IdentitySuspensionSyncFailing` after 3 consecutive
           failures. A `409 InvalidStatusTransition` from Identity is not transient: retries stop, the local suspension stays,
           `identity_sync_status='failed'`, and on-call is paged immediately (`IdentitySyncTransitionRejected`).
        3. **200 only when Identity confirmed.** Otherwise **503 `IdentityUnavailable`** with
           `suspension: "applied-locally, session-revocation-pending"` (`data.identitySyncStatus` is `pending` or `failed`).
           This policy must not degrade. Reinstatement is out of scope for MVP.
      security:
        - bearerUser: []
      x-roles: [admin]
      x-ownership: none
      x-audit: admin-action
      x-audit-actions: [doctor.suspended, consultation.flagged_for_followup, identity_sync.synced]
      x-integration-case: 3
      x-failure-policy: must-not-degrade
      parameters:
        - $ref: '#/components/parameters/RequestId'
