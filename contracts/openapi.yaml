  /api/admin/applications/{id}/approve:
    patch:
      operationId: approveApplication
      tags: [admin-verification]
      summary: Approve a submitted application (Integration Case 1)
      description: |
        1. One transaction: `verification_status='approved'`, `reviewed_by`, `review_note`, `decided_at`,
           `identity_sync_status='pending'`, audit row.
        2. `PATCH /internal/users/{id}/status` on Identity → `active`, up to 3 attempts (2 s timeout each, backoff).
        3. Identity confirmed → `identity_sync_status='synced'`, **200**. Still failing → decision kept, **202** with
           `identitySync: "pending"`; a durable `identity_sync_jobs` retrier continues and alerts after 15 minutes unsynced.
        4. A `409 InvalidStatusTransition` from Identity is non-retryable: `identity_sync_status='failed'`, alert
           `IdentitySyncTransitionRejected`, **202** with `identitySync: "failed"`, surfaced in the admin console.
        The doctor is not bookable until `approved` **and** `synced`. Only `submitted` applications are reviewable.
      security:
        - bearerUser: []
      x-roles: [admin]
      x-ownership: none
      x-audit: admin-action
      x-audit-actions: [verification.approved, identity_sync.synced]
      x-integration-case: 1
      x-failure-policy: retry-report-pending
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
