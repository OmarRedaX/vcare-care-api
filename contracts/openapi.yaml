# SOURCE OF TRUTH for the care-service HTTP API (public /api/* and network-isolated /internal/*).
# Human view: docs/architecture/api.md (derived from this file; on disagreement this file wins).
# Hub sync copies this file to ../vcare-hub/contracts/care-service.openapi.yaml — never hand-edit the hub copy.
# Change order: edit this contract first, then code (CLAUDE.md -> Build order for a new module).
# Conventions: ids are BIGSERIAL numbers (int64); datetimes are ISO-8601 with offset; money is INT minor units + ISO-4217 currency;
# every list is cursor-paginated; every error uses the one ErrorEnvelope shared with identity-service.
openapi: 3.1.0
info:
  title: vcare Care Service API
  version: 1.0.0
  summary: The medical marketplace — doctors, verification, schedules, consultations, clinical records, help content, audit.
  description: |
    Care owns doctor profiles and credentialing, specialties, working hours and exceptions, consultation types,
    consultations and their lifecycle, patient profiles, medical records (24 h lock + amendments), help articles,
    and the audit log. It never stores passwords or issues tokens; it holds only Identity `user_id` references.

    **Authentication.** User requests carry an EdDSA access token issued by identity-service and verified locally
    against Identity's JWKS (`iss=vcare-identity`, `aud` contains `vcare-care`, `typ=user`). `/internal/*` accepts only
    service tokens (`typ=service`, `aud` contains `vcare-care`, scope `doctors:read`); a user token there, even an
    admin's, returns `401 ServiceTokenRequired`. Caller-supplied identity headers (`X-User-Id`, `X-Role`) are ignored.

    **Vendor extensions on operations.**
    - `x-roles` — roles allowed by the route policy (`patient`, `doctor`, `admin`, or `service`). Admin never appears on record routes.
    - `x-ownership` — the ownership predicate resolved from the database (`none`, `self`, `participant`, `assigned-doctor`, `consulted-patient-or-self`, ...).
    - `x-audit` — audit class forced by the policy (`clinical-read`, `clinical-write`, `admin-action`).
    - `x-audit-actions` — the `audit_logs.action` values the operation writes (status changes are always audited).
    - `x-integration-case` / `x-failure-policy` — the platform integration case with identity-service and its failure policy
      (`retry-report-pending` for Case 1, `degrade` for Case 2, `must-not-degrade` for Case 3).

    **Viewer-aware responses.** The same resource renders fewer fields for an admin: admin views of a consultation omit
    `complaintText`, and admins are denied on every clinical-record route.

    **Private resources.** Consultations, records, and patient profiles return `404 NotFound` to callers who are not
    allowed to see them, so existence cannot be probed.

    MVP is HTTP-only; no events are published (see `x-future-events`).
  contact:
    name: care-team
  license:
    name: Proprietary
    identifier: LicenseRef-vcare-proprietary
servers:
  - url: http://localhost:3001
    description: Public listener (PORT=3001). Paths start with /api.
tags:
  - name: health
    description: Liveness and dependency checks.
  - name: specialties
    description: Medical specialties (admin-managed catalog).
  - name: doctors-onboarding
    description: A doctor's own profile, verification documents, and application.
  - name: doctors-discovery
    description: Patient and admin search, doctor profile, computed slots.
  - name: schedules
    description: A doctor's working hours, schedule exceptions, and consultation types.
  - name: admin-verification
    description: Application review (Integration Case 1).
  - name: admin-doctors
    description: Doctor suspension (Integration Case 3).
  - name: patients
    description: Patient profiles and the clinical timeline.
  - name: consultations
    description: Booking, lifecycle, waiting room, calendar.
  - name: records
    description: Medical records, amendments, attachments.
  - name: help-articles
    description: Help center content (Phase-2 RAG corpus).
  - name: audit
    description: Append-only audit log (metadata only).
  - name: internal
    description: Network-isolated service-to-service endpoints (INTERNAL_PORT=3101).

x-future-events:
  description: >-
    MVP is HTTP-only; there is no AsyncAPI contract. These events are candidates for a future message bus
    (RabbitMQ is the candidate transport, adopted only by an ADR). Names are reserved, payloads are not yet defined.
  events:
    - consultation.booked
    - consultation.rescheduled
    - consultation.cancelled
    - doctor.verified
    - doctor.suspended

paths:
  # ─────────────────────────────────────────────────────────────── health
  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Public health check (Postgres, Redis, cached JWKS)
      description: Unauthenticated. Returns 503 with `status=down` when Postgres or Redis is unreachable. Identity being down does not fail this check while a cached JWKS key exists.
      security: []
      x-roles: [public]
      x-ownership: none
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '503':
          $ref: '#/components/responses/HealthDown'

  /internal/health:
    get:
      operationId: getInternalHealth
      tags: [health, internal]
      summary: Internal listener health check
      description: Served only on the internal listener. Unauthenticated; the network isolation is the protection.
      servers:
        - url: http://localhost:3101
          description: Internal listener (INTERNAL_PORT=3101), network-isolated, never routed by the public ingress.
      security: []
      x-roles: [public]
      x-ownership: none
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '503':
          $ref: '#/components/responses/HealthDown'

  # ─────────────────────────────────────────────────────────────── specialties
  /api/specialties:
    get:
      operationId: listSpecialties
      tags: [specialties]
      summary: List specialties
      description: Non-admins see active specialties only; admins may pass `includeInactive=true`.
      security:
        - bearerUser: []
      x-roles: [patient, doctor, admin]
      x-ownership: none
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: includeInactive
          in: query
          required: false
          description: Admin only; ignored for other roles.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of specialties sorted by name.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Specialty'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSpecialty
      tags: [specialties]
      summary: Create a specialty
      security:
        - bearerUser: []
      x-roles: [admin]
      x-ownership: none
      x-audit: admin-action
      x-audit-actions: [specialty.created]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialtyCreate'
      responses:
        '201':
          description: Specialty created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/Specialty'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/specialties/{id}:
    patch:
      operationId: updateSpecialty
      tags: [specialties]
      summary: Update a specialty (name, slug, description, active flag)
      security:
        - bearerUser: []
      x-roles: [admin]
      x-ownership: none
      x-audit: admin-action
      x-audit-actions: [specialty.updated]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialtyUpdate'
      responses:
        '200':
          description: Specialty updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/Specialty'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────────────────────────── doctors: onboarding (own)
  /api/doctors/apply:
    post:
      operationId: applyAsDoctor
      tags: [doctors-onboarding]
      summary: Create or update the caller's doctor application, optionally submitting it for review
      description: |
        Onboarding route: accepts a doctor token with `status` `pending`, `active`, or `rejected` (a doctor applies before approval; a rejected doctor can fix and resubmit).
        Creates the caller's doctor profile in `draft` (201) or updates an existing `draft`/`rejected` profile (200).
        With `submit=true` the application moves to `submitted`; this requires at least one live `license` and one
        live `id` verification document (else `400 ValidationFailed` with `details[].field = "documents"`).
        A profile already `submitted` or `approved` returns `409 Conflict`.
        Upload documents with `POST /api/doctors/me/documents` after the draft exists.

        **Resubmission** (`rejected → submitted`) follows the Integration Case 1 path with Identity status `pending`, so the
        account returns to `pending` alongside the application: 200 when Identity confirmed, 202 with
        `identitySync: "pending"` (or `"failed"` on a non-retryable `409 InvalidStatusTransition` from Identity) otherwise.
        `draft → submitted` makes no Identity call.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status in (pending, active, rejected)'
      x-audit-actions: [verification.submitted, identity_sync.synced]
      x-integration-case: 1
      x-failure-policy: retry-report-pending
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorApplyRequest'
      responses:
        '200':
          $ref: '#/components/responses/DoctorProfileOwnOk'
        '201':
          $ref: '#/components/responses/DoctorProfileOwnCreated'
        '202':
          $ref: '#/components/responses/ApprovalPendingSync'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me:
    get:
      operationId: getMyDoctorProfile
      tags: [doctors-onboarding]
      summary: Get the caller's own doctor profile (full own view)
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status in (pending, active, rejected)'
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/DoctorProfileOwnOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMyDoctorProfile
      tags: [doctors-onboarding]
      summary: Update the caller's profile fields, timezone, and accepting-patients toggle
      description: |
        Changing `timezone` or `isAcceptingPatients` invalidates the doctor's slot and next-available caches.
        Turning `isAcceptingPatients` off never cancels existing consultations. A locally suspended doctor gets `403 Forbidden`.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status in (pending, active, rejected); not locally suspended'
      x-audit-actions: [doctor.profile_updated]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/DoctorProfileOwnOk'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me/documents:
    post:
      operationId: uploadVerificationDocument
      tags: [doctors-onboarding]
      summary: Upload a verification document (license, id, degree)
      description: |
        `multipart/form-data`. MIME allowlist `application/pdf`, `image/jpeg`, `image/png` (content-sniffed), 10 MB cap,
        random object key (the client filename is never used in the key). Allowed only while the application is
        `draft` or `rejected`. Rate limit 20 uploads/hour per user.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status in (pending, active, rejected)'
      x-audit-actions: [verification.document_uploaded]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDocumentUpload'
      responses:
        '201':
          description: Document stored. The response carries a signed download URL bound to the caller.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/VerificationDocument'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me/application:
    get:
      operationId: getMyApplication
      tags: [doctors-onboarding]
      summary: Track the caller's verification application
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status in (pending, active, rejected)'
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/VerificationApplicationOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────────────────────────── schedules (own)
  /api/doctors/me/working-hours:
    get:
      operationId: getMyWorkingHours
      tags: [schedules]
      summary: Get the caller's recurring weekly hours (doctor-local wall clock)
      description: Bounded collection (at most 7 weekdays with their shifts); not paginated.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/WorkingHoursOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceMyWorkingHours
      tags: [schedules]
      summary: Replace the caller's weekly hours (split shifts allowed)
      description: |
        Replaces the full weekly set. Intervals on the same weekday must not overlap. If the new hours would leave any
        future non-terminal consultation outside working hours, the call returns `409 ScheduleConflictsUnconfirmed`
        listing the affected consultation ids; resubmit with `confirmConflicts=true` to apply, flag those consultations
        `needs_admin_followup`, and queue patient notifications. Consultations are never moved or cancelled automatically.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      x-audit: admin-action
      x-audit-actions: [schedule.hours_replaced, schedule.conflicts_confirmed]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkingHoursReplace'
      responses:
        '200':
          $ref: '#/components/responses/WorkingHoursOk'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScheduleConflictsUnconfirmed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me/exceptions:
    get:
      operationId: listMyExceptions
      tags: [schedules]
      summary: List the caller's schedule exceptions (day off, custom hours)
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: fromDate
          in: query
          required: false
          description: Inclusive doctor-local date. Defaults to today in the doctor's timezone.
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          description: Inclusive doctor-local date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of exceptions ordered by date ascending.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleException'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMyException
      tags: [schedules]
      summary: Block a date or date range (leave) or override hours for one date
      description: |
        `day_off` may cover a range (`date`..`endDate`, at most 60 days) and creates one row per doctor-local date.
        `custom_hours` covers exactly one date and replaces (does not add to) that weekday's hours.
        A date that already has a live exception returns `409 Conflict`. Intersecting existing non-terminal consultations
        without `confirmConflicts=true` returns `409 ScheduleConflictsUnconfirmed` (flow F).
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      x-audit: admin-action
      x-audit-actions: [schedule.exception_created, schedule.conflicts_confirmed]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleExceptionCreate'
      responses:
        '201':
          description: Exception rows created (one per date).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleException'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ScheduleConflictsUnconfirmed'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me/exceptions/{id}:
    delete:
      operationId: deleteMyException
      tags: [schedules]
      summary: Remove a schedule exception (soft delete)
      description: Sets `deleted_at`. An id not belonging to the caller's profile returns `404 NotFound`.
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      x-audit-actions: [schedule.exception_deleted]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/doctors/me/consultation-types:
    get:
      operationId: listMyConsultationTypes
      tags: [schedules]
      summary: List the caller's consultation types
      security:
        - bearerUser: []
      x-roles: [doctor]
      x-ownership: self
      x-account-state: 'status active; not locally suspended'
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A page of consultation types ordered by id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultationType'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
