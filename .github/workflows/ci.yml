name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same stack as local runs: Postgres, Redis and MinIO (storage-adapter + verification suites need it).
      - run: npm run test:infra:up
      # global-setup runs the migrations before the suites.
      - run: npm run test:integration
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t care-service:ci .
