# Local development stack. Host ports 5433/6380 leave 5432/6379 to identity-service.
# Postgres (known credentials) and Redis (no auth) are published on host loopback only.
name: vcare-care

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - care-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    # Owner runs the migrations, then creates/updates the app login from DATABASE_URL (ADR 0018).
    command: ["sh", "-c", "node dist/migrate.js latest && node dist/migrate.js ensure-app-login"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://care:care@postgres:5432/care
      DATABASE_URL: postgres://care_app:care_app@postgres:5432/care
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://host.docker.internal:3000/.well-known/jwks.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  care-api:
    build: .
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      INTERNAL_PORT: 3101
      INTERNAL_HOST: 0.0.0.0
      DATABASE_URL: postgres://care_app:care_app@postgres:5432/care
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://host.docker.internal:3000/.well-known/jwks.json}
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
      - "127.0.0.1:3101:3101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  care-worker:
    build: .
    init: true
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://care_app:care_app@postgres:5432/care
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://host.docker.internal:3000/.well-known/jwks.json}
      AUDIT_PARTITION_MONTHS_AHEAD: 2
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  care-pg-data:
